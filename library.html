<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeriCorpus | Domain Reference Library</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="library.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>VeriCorpus <span>Reference Library</span></h1>
    </div>
    <button type="button" id="new-book-btn" class="btn-primary">+ New Book</button>
  </header>

  <main class="container">
    <div class="section-header">
      <span class="section-eyebrow">Pod Knowledge Base</span>
      <h2>Verified Technical &amp; Domain Manuals</h2>
    </div>

    <div id="library-grid" class="library-grid"></div>
  </main>

  <dialog id="book-dialog" class="modal">
    <form id="book-form" method="dialog" class="modal-form">
      <div class="modal-header">
        <h3>Add Reference Book</h3>
        <button type="button" id="close-dialog-btn" class="icon-close">&times;</button>
      </div>

      <div class="form-group">
        <label for="title">Book Title</label>
        <input type="text" id="title" name="title" placeholder="e.g., KD Tripathi Pharmacology" required>
      </div>

      <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" name="author" placeholder="e.g., K.D. Tripathi" required>
      </div>

      <div class="form-group">
        <label for="pages">Number of Pages</label>
        <input type="number" id="pages" name="pages" min="1" placeholder="e.g., 1040" required>
      </div>

      <label class="checkbox-row" for="read">
        <input type="checkbox" id="read" name="read">
        <span>I have already read this book</span>
      </label>

      <button type="submit" class="btn-primary full-width">Add to Library</button>
    </form>
  </dialog>
</body>
</html>
